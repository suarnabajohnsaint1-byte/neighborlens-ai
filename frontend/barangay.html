<!DOCTYPE html>
<html lang="en" data-theme-enabled>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Action Center | NeighborLens AI</title>
    <script src="js/shared/themeManager.js"></script>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/sidebar.css?v=brand-logo">
    <link rel="stylesheet" href="styles/theme-controls.css">
    <link rel="stylesheet" href="styles/portal-components.css">
    <link rel="stylesheet" href="styles/report-details.css">
    <link rel="stylesheet" href="styles/my-reports.css">
    <link rel="stylesheet" href="styles/report-card.css">
    <link rel="stylesheet" href="styles/admin-analytics.css">
    <link rel="stylesheet" href="styles/barangay.css">
    <link rel="stylesheet" href="styles/report-gis.css">
    <link rel="stylesheet" href="styles/report-export.css">
    <link rel="stylesheet" href="styles/report-management.css">
    <link rel="stylesheet" href="styles/community.css?v=10">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css" integrity="sha256-LJzbbQFquR1Trwrwy++9x2Pl6ipfBZUR8Da0GGJ8Wfo=" crossorigin="anonymous">
    <script src="js/auth/security.js" defer></script>
    <script src="js/shared/appearanceControl.js" defer></script>
    <script src="js/shared/portalSidebar.js?v=brand-logo" defer></script>
    <link rel="stylesheet" href="styles/notifications.css">
    <link rel="stylesheet" href="styles/report-print.css" media="print">
</head>

<body class="staff-portal barangay-portal">
    <div class="dashboard">
        <aside id="barangaySidebar" class="sidebar" data-portal-sidebar="barangay" data-sidebar-mode="drawer"
            data-sidebar-toggle="barangayMenu" data-sidebar-backdrop="barangayBackdrop"
            data-sidebar-content="barangayContent" aria-label="Barangay navigation"></aside>
        <div id="barangayBackdrop" hidden></div>
        <main id="barangayContent" class="content">
            <header class="barangay-header">
                <button id="barangayMenu" type="button" aria-label="Open navigation" aria-controls="barangaySidebar"
                    aria-expanded="false"><i class="bx bx-menu" aria-hidden="true"></i></button>
                <div>
                    <h1 id="barangayPageTitle">Local Reports</h1>
                    <p id="barangayPageDescription">Review and manage infrastructure reports assigned to your Barangay.</p>
                    <p id="brgyName"></p>
                </div><span class="header-badge">Barangay official</span>
                <div class="notification-bell-container" data-staff-notifications="barangay"></div>
            </header>
            <div class="portal-report-summary" data-report-summary="barangay" role="group" aria-label="Filtered assigned report totals"></div>
            <section class="barangay-reports" aria-labelledby="reportsHeading">
                <div class="barangay-reports-heading">
                    <div>
                        <h2 id="reportsHeading">Local Reports</h2>
                        <span id="filterCount" class="barangay-report-count"></span>
                    </div>
                    <div class="barangay-heading-actions">
                        <button id="barangayExportReports" type="button" class="portal-button-secondary report-export-button" title="Export all reports matching current filters"><i class="bx bx-spreadsheet" aria-hidden="true"></i>Export Excel</button>
                        <button id="clearFilters" type="button" class="portal-button-secondary"><i
                                class="bx bx-filter-alt" aria-hidden="true"></i>Clear filters</button>
                        <div id="barangayViewToggle" class="portal-view-toggle" role="group" aria-label="View layout">
                            <button type="button" class="portal-view-btn is-active" data-view-mode="grid"
                                aria-pressed="true" aria-label="Card grid view" title="Card grid view"><i
                                    class="bx bx-grid-alt" aria-hidden="true"></i><span>Cards</span></button>
                            <button type="button" class="portal-view-btn" data-view-mode="row" aria-pressed="false"
                                aria-label="Row list view" title="Row list view"><i class="bx bx-list-ul"
                                    aria-hidden="true"></i><span>List</span></button>
                            <button type="button" class="portal-view-btn" data-view-mode="split" aria-pressed="false"
                                aria-label="Split detail view" title="Split detail view"><i class="bx bx-columns"
                                    aria-hidden="true"></i><span>Split Detail</span></button>
                        </div>
                    </div>
                </div>
                <div class="barangay-statuses-row">
                    <div class="barangay-statuses" role="group" aria-label="Report status">
                        <button type="button" data-status-filter="all" aria-pressed="true">All</button>
                        <button type="button" data-status-filter="pending" aria-pressed="false">Pending</button>
                        <button type="button" data-status-filter="ongoing" aria-pressed="false">Ongoing</button>
                        <button type="button" data-status-filter="resolved" aria-pressed="false">Resolved</button>
                        <button type="button" data-status-filter="rejected" aria-pressed="false">Rejected</button>
                    </div>
                </div>
                <div class="barangay-toolbar">
                    <div class="barangay-search portal-search">
                        <label for="reportSearch" class="mr-sr-only">Search reports</label>
                        <i class="bx bx-search" aria-hidden="true"></i>
                        <input id="reportSearch" type="search" data-query="search"
                            placeholder="Search reports, issue, location, or reporter..." autocomplete="off">
                    </div>
                    <div class="barangay-toolbar-controls">
                        <div class="barangay-field-compact">
                            <span class="barangay-field-label">Sort by</span>
                            <div class="barangay-select-wrap">
                                <i class="bx bx-sort" aria-hidden="true"></i>
                                <select id="filterSort" data-query="sort" class="filter-select">
                                    <option value="newest">Newest first</option>
                                    <option value="oldest">Oldest first</option>
                                    <option value="priority">Priority</option>
                                </select>
                            </div>
                        </div>
                        <div class="barangay-field-compact barangay-date-range">
                            <span class="barangay-field-label">Date range</span>
                            <div class="barangay-date-wrap">
                                <i class="bx bx-calendar" aria-hidden="true"></i>
                                <input id="filterDateFrom" type="date" data-query="dateFrom"
                                    class="filter-select date-compact" aria-label="Date from">
                                <span class="date-sep">&ndash;</span>
                                <input id="filterDateTo" type="date" data-query="dateTo"
                                    class="filter-select date-compact" aria-label="Date to">
                                <i class="bx bx-chevron-down date-chevron" aria-hidden="true"></i>
                            </div>
                        </div>
                        <button type="button" id="moreFiltersBtn" class="portal-more-filters-btn"
                            data-sheet-open="barangayFilters" aria-controls="barangayFilters" aria-expanded="false">
                            <i class="bx bx-filter" aria-hidden="true"></i>
                            <span>More filters</span>
                            <span id="moreFiltersCount" class="portal-filter-count" hidden></span>
                            <i class="bx bx-chevron-down" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div id="barangayFilters" class="portal-sheet" tabindex="-1" data-sheet
                    aria-labelledby="barangayFiltersTitle" hidden>
                    <div class="portal-sheet-header">
                        <h3 id="barangayFiltersTitle">More filters</h3>
                        <button type="button" data-sheet-close class="portal-icon-button" aria-label="Close filters"><i
                                class="bx bx-x" aria-hidden="true"></i></button>
                    </div>
                    <div class="barangay-filter-grid portal-sheet-body">
                        <label>Classification
                            <select id="filterClassification" data-query="classification">
                                <option value="all">All classifications</option>
                                <option value="MAJOR">Major</option>
                                <option value="MINOR">Minor</option>
                                <option value="UNCLASSIFIED">Unclassified</option>
                            </select>
                        </label>
                        <label>Priority
                            <select id="filterPriority" data-query="priority">
                                <option value="all">All priorities</option>
                                <option>Critical</option>
                                <option>High</option>
                                <option>Medium</option>
                                <option>Low</option>
                                <option>Unprioritized</option>
                            </select>
                        </label>
                        <label>Category
                            <select id="filterCategory" data-query="category">
                                <option value="all">All categories</option>
                                <option>Road Damage</option>
                                <option>Flooding / Drainage</option>
                                <option>Street Light Damage</option>
                                <option>Uncategorized</option>
                            </select>
                        </label>
                    </div>
                    <div class="portal-sheet-actions">
                        <button type="button" data-sheet-clear class="portal-button-secondary">Clear</button>
                        <button type="button" data-sheet-apply class="btn-main">Apply filters</button>
                    </div>
                </div>
                <div id="reportLoadFeedback" class="portal-notice" role="status" hidden><span></span><button
                        type="button" id="retryReports" class="portal-button-secondary">Retry</button></div>
                <p id="statusFeedback" class="portal-feedback" role="status" aria-live="polite" hidden></p>
                <div id="reportsBody" class="barangay-list" role="list" aria-label="Assigned reports"></div>
                <nav class="barangay-pagination" aria-label="Report pagination">
                    <span id="reportsPageInfo"></span>
                    <label>Per page <select data-query="pageSize" aria-label="Reports per page">
                            <option value="3">3</option>
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                        </select></label>
                    <div><button id="reportsPrev" type="button" aria-label="Previous page"><i class="bx bx-chevron-left"
                                aria-hidden="true"></i></button><span id="reportsPageNumber"></span><button
                            id="reportsNext" type="button" aria-label="Next page"><i class="bx bx-chevron-right"
                                aria-hidden="true"></i></button></div>
                </nav>
            </section>
            <section id="barangayAnalyticsSection" data-analytics-details hidden aria-label="Assigned Barangay analytics">
                <div id="barangayAnalytics"></div>
            </section>
            <section id="communitySection" class="community-feed" hidden aria-label="Barangay Community Feed"></section>
            <section id="barangayGis" class="barangay-operation" hidden aria-labelledby="barangayGisTitle">
                <h2 id="barangayGisTitle">GIS Map</h2>
                <form data-operation-filters="gis" class="gis-filters">
                    <label>Status<select name="status"><option value="all">All statuses</option><option value="pending">Pending</option><option value="ongoing">Ongoing</option><option value="resolved">Resolved</option><option value="rejected">Rejected</option></select></label>
                    <label>Classification<select name="classification"><option value="all">All classifications</option><option value="MAJOR">Major</option><option value="MINOR">Minor</option><option value="UNCLASSIFIED">Unclassified</option></select></label>
                    <label>Category<select name="category"><option value="all">All categories</option><option>Road Damage</option><option>Flooding / Drainage</option><option>Street Light Damage</option><option>Uncategorized</option></select></label>
                    <button type="submit" class="portal-button-secondary">Apply filters</button>
                </form>
                <p data-operation-state="gis" role="status"></p>
                <div id="barangayGisMap" class="barangay-gis-map" aria-label="Authorized report locations"></div>
                <div id="barangayGisLegend"></div>
            </section>
            <section id="barangayActivity" class="barangay-operation" hidden aria-labelledby="barangayActivityTitle">
                <h2 id="barangayActivityTitle">Activity Logs</h2>
                <form data-operation-filters="activity" class="barangay-operation-filters">
                    <label>Report reference<input name="search" type="search" maxlength="100" placeholder="Report number"></label>
                    <div class="activity-action-field">
                        <span id="activityActionLabel">Action</span>
                        <details class="activity-action-picker">
                            <summary aria-labelledby="activityActionLabel activityActionValue"><span id="activityActionValue">All report actions</span><i class="bx bx-chevron-down" aria-hidden="true"></i></summary>
                            <fieldset><legend>Report action</legend>
                                <label><input type="radio" name="action" value="" checked><span>All report actions</span></label>
                                <label><input type="radio" name="action" value="create"><span>Created</span></label>
                                <label><input type="radio" name="action" value="status_update"><span>Status changed</span></label>
                                <label><input type="radio" name="action" value="classification_update"><span>Classification changed</span></label>
                                <label><input type="radio" name="action" value="assign"><span>Assigned</span></label>
                                <label><input type="radio" name="action" value="reassign"><span>Reassigned</span></label>
                                <label><input type="radio" name="action" value="review"><span>Reviewed</span></label>
                            </fieldset>
                        </details>
                    </div>
                    <label>Date from<input name="dateFrom" type="date"></label><label>Date to<input name="dateTo" type="date"></label>
                    <button type="submit" class="portal-button-secondary">Apply filters</button>
                </form>
                <p data-operation-state="activity" role="status"></p>
                <div id="barangayActivityRows" class="barangay-activity-rows"></div>
                <nav class="portal-pagination" aria-label="Activity pages"><label class="portal-page-size">Per page<select data-operation-size="activity"><option>5</option><option selected>10</option><option>20</option></select></label><div class="portal-page-buttons"><button class="portal-icon-button" type="button" data-operation-prev="activity" aria-label="Previous activity page"><i class="bx bx-chevron-left" aria-hidden="true"></i></button><span class="portal-page-number" data-operation-page="activity"></span><button class="portal-icon-button" type="button" data-operation-next="activity" aria-label="Next activity page"><i class="bx bx-chevron-right" aria-hidden="true"></i></button></div></nav>
            </section>
        </main>
    </div>
    <dialog id="reportModal" class="report-dialog" aria-labelledby="barangayReportTitle">
        <div class="report-dialog-header">
            <h2 id="barangayReportTitle" data-report-dialog-title>Report details</h2><button type="button"
                class="portal-icon-button" data-report-dialog-close aria-label="Close report details"><i class="bx bx-x"
                    aria-hidden="true"></i></button>
        </div>
        <div class="report-dialog-body">
            <p data-report-dialog-state role="status" hidden></p>
            <div id="modalBody" data-report-dialog-content></div>
        </div>
    </dialog>
    <script src="../shared/reportVocabulary.js"></script>
    <script src="../shared/manilaDates.js"></script>
    <script src="js/shared/api.js"></script>
    <script src="js/shared/reportExport.js"></script>
    <script src="js/shared/reportPrint.js"></script>
    <script src="js/shared/portalComponents.js"></script>
    <script src="js/shared/portalRefresh.js"></script>
    <script src="js/shared/reportMutations.js"></script>
    <script src="js/shared/reportEvidence.js"></script>
    <script src="js/shared/reportPresentation.js"></script>
    <script src="js/shared/reportCard.js"></script>
    <script src="js/shared/reportManagement.js"></script>
    <script src="js/shared/reportDetailsApi.js"></script>
    <script src="js/shared/mediaCarousel.js"></script>
    <script src="js/shared/evidenceZoom.js"></script>
    <script src="js/shared/evidenceViewer.js"></script>
    <script src="js/reports/reportReviewPanel.js"></script>
    <script src="js/reports/incidentReviewPanel.js"></script>
    <script src="js/reports/reportDetailsView.js"></script>
    <script src="js/shared/reportDialog.js"></script>
    <script src="js/community/communityApi.js?v=7"></script>
    <script src="js/community/communityState.js?v=6"></script>
    <script src="js/community/communityCards.js?v=7"></script>
    <script src="js/community/communityComments.js?v=7"></script>
    <script src="js/community/communityView.js?v=9"></script>
    <script src="js/community/communityFeed.js?v=6"></script>
    <script src="shared/geoContainment.js"></script>
    <script src="js/map/mapConfig.js?v=osm-land-v3"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet-global.js" integrity="sha256-nl7XkKmiNbIIlFaAzV6sKcwMkspAqOxnm90ogLJ7Duo=" crossorigin="anonymous"></script>
    <script src="js/shared/reportGisPresentation.js"></script>
    <script src="js/shared/reportGis.js"></script>
    <script src="js/shared/activityLogView.js"></script>
    <script src="js/barangay/viewState.js"></script>
    <script src="js/shared/chartLifecycle.js"></script>
    <script src="js/shared/analyticsApi.js"></script>
    <script src="js/shared/analyticsState.js"></script>
    <script src="js/shared/analyticsCharts.js"></script>
    <script src="js/shared/analyticsPanel.js"></script>
    <script src="js/shared/analyticsDashboard.js"></script>
    <script src="js/barangay/reportsApi.js"></script>
    <script src="js/barangay/reportState.js"></script>
    <script src="js/barangay/reportListView.js"></script>
    <script src="js/barangay/barangay.js"></script>
    <script src="js/barangay/operations.js"></script>
    <script src="js/shared/staffNotifications.js"></script>
</body>

</html>
